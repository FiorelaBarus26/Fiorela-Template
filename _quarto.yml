project:
  type: book
  output-dir: docs
  resources:
    - .nojekyll
    - images/author/foto fiorela.png
    - epub-reader.html
    - assets/epub-reader.js

book:
  title: "Praktikum Pengantar Statistika"
  author: "Fiorela Natanya Barus"
  date: today
  description: "Deskripsi singkat tentang buku"
  cover-image: images/cover lala.png
  repo-url: https://github.com/FiorelaBarus26/Fiorela-Template.git
  repo-actions: [edit, issue]
  sidebar:
    tools:
      - icon: file-pdf
        href: Quarto-Template.pdf
        text: Pratinjau PDF
        aria-label: Pratinjau PDF
      - icon: journal
        href: epub-reader.html
        text: Pratinjau EPUB
        aria-label: Pratinjau EPUB
  chapters:
    - index.qmd
    - chapters/bab-9.qmd
    - chapters/bab-10.qmd
    - chapters/bab-3.qmd
    - references/referensi.qmd

bibliography:
  - references/book.bib
  - references/packages.bib
csl: references/ieee.csl
link-citations: true

format:
  html:
    theme: cosmo
    css: assets/style.css
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    code-fold: false
    smooth-scroll: true
    link-external-newwindow: true
    include-after-body: assets/hover-preview.html
    include-in-header:
      text: |
        <meta name="author" content="Bakti Siregar, M.Sc.">
  pdf:
    documentclass: book
    pdf-engine: xelatex
    keep-tex: true
    include-in-header: assets/preamble.tex
    number-sections: true
    toc: true
  epub:
    cover-image: images/Cover.png

execute:
  freeze: auto
  echo: true
  warning: false
  message: false

lang: id
